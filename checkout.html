<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout | STYLE STORE</title>

    <link rel="stylesheet" href="CSS/master.css">

</head>


<body>


<header class="navbar">

    <a href="index.html" class="logo">
        STYLE STORE
    </a>


    <nav>

        <a href="index.html">Home</a>

        <a href="men-jeans.html">Men</a>

        <a href="#">Women</a>

        <a href="#">Kids</a>

        <a href="cart.html">Cart 🛒</a>

    </nav>

</header>



<main>


    <section class="checkout-page">


        <div class="cart-heading">

            <p>STYLE STORE</p>

            <h1>Checkout</h1>

        </div>



        <div class="checkout-container">


            <!-- CUSTOMER INFORMATION -->

            <div class="customer-info">


                <h2>Customer Information</h2>


                <form>


                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                    >



                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter your phone number"
                    >



                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                    >



                    <label for="address">
                        Address
                    </label>

                    <input
                        type="text"
                        id="address"
                        placeholder="Enter your address"
                    >



                    <label for="city">
                        City
                    </label>

                    <input
                        type="text"
                        id="city"
                        placeholder="Enter your city"
                    >



                    <h2>
                        Payment Method
                    </h2>



                    <label class="payment-option">

                        <input
                            type="radio"
                            name="payment"
                            value="cash"
                            checked
                        >

                        Cash on Delivery

                    </label>



                    <label class="payment-option">

                        <input
                            type="radio"
                            name="payment"
                            value="card"
                        >

                        Credit / Debit Card

                    </label>



                    <div class="card-info">


                        <label for="card-number">
                            Card Number
                        </label>

                        <input
                            type="text"
                            id="card-number"
                            placeholder="1234 5678 9012 3456"
                        >



                        <label for="card-name">
                            Cardholder Name
                        </label>

                        <input
                            type="text"
                            id="card-name"
                            placeholder="Name on card"
                        >



                        <label for="expiry">
                            Expiry Date
                        </label>

                        <input
                            type="text"
                            id="expiry"
                            placeholder="MM/YY"
                        >



                        <label for="cvv">
                            CVV
                        </label>

                        <input
                            type="text"
                            id="cvv"
                            placeholder="123"
                        >


                    </div>



                    <button type="submit">
                        Place Order
                    </button>


                </form>


            </div>



            <!-- ORDER SUMMARY -->

            <aside class="order-summary">


                <h2>
                    Order Summary
                </h2>



                <div class="summary-item">

                    <p>
                        Product
                    </p>

                    <span>
                        Slim Fit Blue Jeans
                    </span>

                </div>



                <div class="summary-item">

                    <p>
                        Size
                    </p>

                    <span>
                        M
                    </span>

                </div>



                <div class="summary-item">

                    <p>
                        Quantity
                    </p>

                    <span>
                        1
                    </span>

                </div>



                <div class="summary-item">

                    <p>
                        Price
                    </p>

                    <span>
                        EGP 1,850
                    </span>

                </div>



                <div class="summary-item">

                    <p>
                        Shipping
                    </p>

                    <span>
                        EGP 100
                    </span>

                </div>



                <div class="summary-total">

                    <p>
                        Total
                    </p>

                    <span>
                        EGP 1,950
                    </span>

                </div>


            </aside>


        </div>


    </section>


</main>


</body>

</html>
